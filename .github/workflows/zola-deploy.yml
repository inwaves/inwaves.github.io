name: Deploy Zola site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR checks must never cancel a production deployment.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            heavens/package-lock.json
            orbis/package-lock.json
            cosmographia/package-lock.json
            firmament/package-lock.json

      - name: Build Conceptions of the Heavens (served at /space)
        working-directory: heavens
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Orbis (served at /orbis)
        working-directory: orbis
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Cosmographia (served at /cosmographia)
        working-directory: cosmographia
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Firmament (served at /firmament)
        working-directory: firmament
        run: |
          npm ci
          npm test
          npm run build

      - name: Build site
        run: |
          # Set production base_url for custom domain
          sed -i 's|base_url = ".*"|base_url = "https://inwaves.io"|g' config.toml
          zola build
          # Ensure CNAME is in output directory for GitHub Pages custom domain
          cp CNAME public/CNAME
          # The 3D cosmology app is a static Vite build with relative asset paths
          mkdir -p public/space
          cp -r heavens/dist/. public/space/
          # Orbis is independent of the original /space implementation.
          mkdir -p public/orbis
          cp -r orbis/dist/. public/orbis/
          # Cosmographia is a third, independent implementation, also a relative-base Vite build.
          mkdir -p public/cosmographia
          cp -r cosmographia/dist/. public/cosmographia/
          # Firmament is a further independent implementation, also a relative-base Vite build.
          mkdir -p public/firmament
          cp -r firmament/dist/. public/firmament/

      - name: Test article links and Orbis in the assembled site
        working-directory: orbis
        run: |
          npx playwright install --with-deps chromium
          npm run test:site

      - name: Test the article link and Cosmographia in the assembled site
        working-directory: cosmographia
        run: |
          npx playwright install --with-deps chromium
          npm run test:site

      - name: Test the article link and Firmament in the assembled site
        working-directory: firmament
        run: |
          # Serves public/ on a port of its own choosing, so it cannot collide with port 8080.
          npx playwright install --with-deps chromium
          npm run test:site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
