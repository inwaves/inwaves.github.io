name: Deploy Zola site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: heavens/package-lock.json

      - name: Build Conceptions of the Heavens (served at /space)
        working-directory: heavens
        run: |
          npm ci
          npm test
          npm run build

      - name: Build site
        run: |
          # Set production base_url for custom domain
          sed -i 's|base_url = ".*"|base_url = "https://inwaves.io"|g' config.toml
          zola build
          # Ensure CNAME is in output directory for GitHub Pages custom domain
          cp CNAME public/CNAME
          # The 3D cosmology app is a static Vite build with relative asset paths
          mkdir -p public/space
          cp -r heavens/dist/. public/space/
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
